[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-search-engine"
version = "0.1.0"
description = "Hệ thống tìm kiếm cho trang báo chí số (BM25 + hybrid dense + QDF + dedup)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

# Nhóm phụ thuộc tùy chọn — cài theo backend cần dùng:
#   pip install -e ".[postgres,bge,milvus]"
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]           # SOURCE=postgres
milvus = ["pymilvus>=2.4"]                     # VECTOR_BACKEND=milvus (HNSW)
bge = ["sentence-transformers>=3", "torch>=2.1"]  # EMBEDDER=bge (BGE-m3); hoặc FlagEmbedding
vi = ["sentence-transformers>=3", "torch>=2.1", "pyvi>=0.1", "sentencepiece", "protobuf"]  # EMBEDDER/RERANKER=vi (AITeamVN) + tách từ pyvi
flagembedding = ["FlagEmbedding>=1.2"]         # EMBEDDER=bge / RERANKER=bge/vi (native)
openai = ["openai>=1.30"]                      # EMBEDDER=openai
neo4j = ["neo4j>=5.20"]                        # Knowledge graph production
nlp = ["underthesea>=6.8", "pyvi>=0.1"]        # tách từ (pyvi) + NER tiếng Việt nâng cao
dedup = ["datasketch>=1.6"]                    # DEDUP_BACKEND=datasketch (MinHash-LSH tối ưu)
opensearch = ["opensearch-py>=2.6"]            # LEXICAL_BACKEND=opensearch
redis = ["redis>=5.0"]                         # CACHE_BACKEND=redis / FEEDBACK_BACKEND=redis
dev = ["pytest>=8.0", "httpx>=0.27", "nbconvert", "ipykernel"]

[project.scripts]
news-index = "scripts.index_from_postgres:main"

[tool.setuptools.packages.find]
include = ["news_search*"]

[tool.setuptools.package-data]
news_search = ["api/ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
