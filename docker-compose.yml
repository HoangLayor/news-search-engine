# News Search Engine — Demo Docker.
#
#   docker compose up --build            # demo offline: app + UI tại http://localhost:8000
#   CACHE_BACKEND=redis FEEDBACK_BACKEND=redis docker compose --profile full up --build
#                                        # thêm Redis (cache/feedback dùng chung)
#
# App chạy backend local/hash (offline, không tải model), tự nạp bài mẫu.

services:
  app:
    build: .
    image: news-search-engine:demo
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      MILVUS_RECREATE_ON_DIM_MISMATCH: "false"
      # Route /admin/reindex TẮT mặc định (token rỗng). Bật bằng:
      #   ADMIN_TOKEN=<bí-mật> docker compose up
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Cho phép chuyển cache/feedback sang Redis khi bật profile full
      CACHE_BACKEND: "${CACHE_BACKEND:-memory}"
      FEEDBACK_BACKEND: "${FEEDBACK_BACKEND:-jsonl}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      # Ép chạy trên CPU trong Docker vì container chỉ cài PyTorch bản CPU
      BGE_DEVICE: ""
      # Cấu hình kết nối Milvus (thay thế hoàn toàn OpenSearch)
      VECTOR_BACKEND: milvus
      MILVUS_URI: "http://milvus-standalone:19530"
      # Sử dụng endpoint mặc định của Hugging Face
      HF_ENDPOINT: "https://huggingface.co"
    depends_on:
      milvus-standalone:
        condition: service_healthy
    volumes:
      - feedback:/app/data/feedback # giữ lại log click giữa các lần chạy
      - ./.venv/huggingface_cache:/app/.venv/huggingface_cache # Thay hf_cache bằng dòng này
    restart: unless-stopped

  # --- Milvus + HNSW Vector Database (Hybrid Search) ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.4.15
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530" # gRPC
      - "9091:9091" # metrics/health
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # --- Attu (Giao diện đồ họa quan sát Milvus) ---
  attu:
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: "milvus-standalone:19530"
    ports:
      - "8001:3000"
    depends_on:
      - milvus-standalone
    restart: unless-stopped

  # --- Tùy chọn (profile full): Redis cho cache & feedback dùng chung ---
  # App kết nối qua mạng nội bộ compose (redis://redis:6379); cổng chỉ bind
  # loopback để không phơi Redis (không mật khẩu) ra ngoài. Đặt mật khẩu +
  # REDIS_URL có auth khi dùng thật.
  redis:
    image: redis:7-alpine
    profiles: [ "full" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  feedback:
  hf_cache:
  etcd_data:
  minio_data:
  milvus_data:
