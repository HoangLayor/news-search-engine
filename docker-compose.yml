# News Search Engine — Demo Docker.
#
#   docker compose up --build            # demo offline: app + UI tại http://localhost:8000
#   CACHE_BACKEND=redis FEEDBACK_BACKEND=redis docker compose --profile full up --build
#                                        # thêm Redis (cache/feedback dùng chung)
#
# App chạy backend local/hash (offline, không tải model), tự nạp bài mẫu.

services:
  app:
    build: .
    image: news-search-engine:demo
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Route /admin/reindex TẮT mặc định (token rỗng). Bật bằng:
      #   ADMIN_TOKEN=<bí-mật> docker compose up
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Cho phép chuyển cache/feedback sang Redis khi bật profile full
      CACHE_BACKEND: "${CACHE_BACKEND:-memory}"
      FEEDBACK_BACKEND: "${FEEDBACK_BACKEND:-jsonl}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      # Ép chạy trên CPU trong Docker vì container chỉ cài PyTorch bản CPU
      BGE_DEVICE: ""
      # Chỉ định địa chỉ mạng nội bộ cho OpenSearch khi chạy trong Compose
      OPENSEARCH_URL: "http://opensearch:9200"
    volumes:
      - feedback:/app/data/feedback   # giữ lại log click giữa các lần chạy
      - hf_cache:/app/.venv/huggingface_cache # Lưu model tải về vĩnh viễn
    restart: unless-stopped

  # --- OpenSearch (BM25 Production) ---
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: news-search-engine-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"  # Giới hạn RAM tiết kiệm cho máy dev
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  # --- OpenSearch Dashboards (Giao diện đồ họa quan sát Kibana cho OpenSearch) ---
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: news-search-engine-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    restart: unless-stopped

  # --- Tùy chọn (profile full): Redis cho cache & feedback dùng chung ---
  # App kết nối qua mạng nội bộ compose (redis://redis:6379); cổng chỉ bind
  # loopback để không phơi Redis (không mật khẩu) ra ngoài. Đặt mật khẩu +
  # REDIS_URL có auth khi dùng thật.
  redis:
    image: redis:7-alpine
    profiles: [ "full" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  feedback:
  hf_cache:
  opensearch-data:
