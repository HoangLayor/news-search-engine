# Stack Milvus (standalone) + Attu để QUAN SÁT & QUẢN LÝ vector.
# Dùng CÙNG file compose gốc (override):
#
#   docker compose -f docker-compose.yml -f docker-compose.milvus.yml up --build
#
# App chuyển sang VECTOR_BACKEND=milvus và tự nạp bài mẫu -> vector vào collection
# 'news_articles' (dim 256, embedder hash). Sau khi lên:
#   - Ứng dụng + Demo UI : http://localhost:8000
#   - Attu (quản lý Milvus): http://localhost:8001   (kết nối sẵn milvus-standalone:19530)
#   - Milvus gRPC        : localhost:19530
#
# Nặng (~2GB image + etcd/minio/milvus). Chỉ dùng khi cần quan sát Milvus.

services:
  app:
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: "http://milvus-standalone:19530"
    depends_on:
      milvus-standalone:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # metrics/health
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # Attu — web UI chính thức để quan sát/quản lý Milvus (collection, index, vector)
  attu:
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: "milvus-standalone:19530"
    ports:
      - "8001:3000"
    depends_on:
      - milvus-standalone
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
